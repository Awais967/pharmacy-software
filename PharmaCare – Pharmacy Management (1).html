<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PharmaCare – Pharmacy Management</title>
<style>
:root{--bg:#eef2fb;--cd:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#dde3f0;--pr:#6c47ff;--rd:#d64545;--or:#e8890c;--gr:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--cd:#1a222b;--tx:#e6ebf0;--mu:#8d99a6;--bd:#2a3541}}
:root[data-theme="dark"]{--bg:#11161c;--cd:#1a222b;--tx:#e6ebf0;--mu:#8d99a6;--bd:#2a3541}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:flex;min-height:100vh}nav{width:176px;background:var(--cd);border-right:1px solid var(--bd);padding:12px 8px;flex-shrink:0}
nav h2{margin:4px 8px 14px;font-size:17px;color:var(--pr)}nav a{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mu)}nav a.on,nav a:hover{background:var(--pr);color:#fff}
main{flex:1;padding:16px;min-width:0}h3{margin:0 0 10px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.g .cd{margin:0}.g b{font-size:20px;display:block}.g span{color:var(--mu);font-size:12px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;font:inherit;max-width:100%}
.b{background:var(--pr);color:#fff;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;font:inherit}.b.s{background:var(--bd);color:var(--tx)}.b.d{background:var(--rd)}.b.t{padding:3px 8px;font-size:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.fg label{font-size:12px;color:var(--mu)}.fg input,.fg select{width:100%;display:block}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff}.tag.r{background:var(--rd)}.tag.o{background:var(--or)}.tag.g{background:var(--gr)}
.bars{display:flex;gap:8px;align-items:flex-end;height:140px}.bars div.c{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}.bars i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.mb{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}.mc{background:var(--cd);border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;right:18px;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:99}
#rcpt{font:12px monospace;width:300px;margin:auto;color:#000;background:#fff;padding:8px}#rcpt td,#rcpt th{padding:2px;border:0;color:#000}
nav{background:linear-gradient(180deg,#4a2cc9,#6c47ff 55%,#0fb5ae);border:0}nav h2{color:#fff}nav a{color:#e9e3ff;margin-bottom:2px}nav a.on,nav a:hover{background:#ffffff33;color:#fff}
.g .cd{color:#fff;border:0;box-shadow:0 4px 14px #0002}.g .cd span{color:#ffffffd0}.g .cd b{color:#fff!important}.g .cd:nth-child(6n+1){background:linear-gradient(135deg,#6c47ff,#a78bff)}.g .cd:nth-child(6n+2){background:linear-gradient(135deg,#0fb5ae,#4fe0a0)}.g .cd:nth-child(6n+3){background:linear-gradient(135deg,#ff7a45,#ffb347)}.g .cd:nth-child(6n+4){background:linear-gradient(135deg,#e5484d,#ff8a8a)}.g .cd:nth-child(6n+5){background:linear-gradient(135deg,#2f80ed,#56ccf2)}.g .cd:nth-child(6n+6){background:linear-gradient(135deg,#8e2de2,#f55bd0)}
h3{color:var(--pr)}th{background:#6c47ff14}tbody tr:hover td{background:#6c47ff0d}.cd{border-top:3px solid var(--pr)}.g .cd{border-top:0}
.b{background:linear-gradient(135deg,#6c47ff,#0fb5ae)}.b.d{background:linear-gradient(135deg,#e5484d,#ff8a5c)}.mc{border-top:5px solid var(--pr)}
@media(max-width:700px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border-right:0;padding:6px}nav h2{display:none}nav a{white-space:nowrap}}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div><div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='pharmacare_v1';
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},td=()=>addD(0);
const dl=e=>Math.ceil((new Date(e)-new Date(td()))/864e5),sum=(a,k)=>a.reduce((x,y)=>x+y[k],0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>D.set.cur+' '+(+n).toFixed(2);
let D,V='dash',S={q:''},P,C={items:[]},R={f:addD(-29),t:td()},F='all';
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.background=bad?'var(--rd)':'';e.style.color=bad?'#fff':'';e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function seed(){
 const L=[['Panadol 500mg','Paracetamol','GSK','Tablet',2,3,200,400,50],['Brufen 400','Ibuprofen','Abbott','Tablet',4,6,120,40,30],['Augmentin 625','Amoxicillin/Clav','GSK','Tablet',45,60,60,300,20],['Flagyl 400','Metronidazole','Sanofi','Tablet',5,8,90,250,30],['Risek 20','Omeprazole','Getz','Capsule',10,14,100,500,30],['Ventolin Inhaler','Salbutamol','GSK','Inhaler',180,220,15,365,5],['Calpol Syrup','Paracetamol','GSK','Syrup',90,115,25,200,10],['Cefixime 200','Cefixime','Searle','Capsule',30,42,8,60,15],['Disprin','Aspirin','Reckitt','Tablet',1.5,2.5,30,-12,20],['Voltaren Inj','Diclofenac','Novartis','Injection',25,35,40,180,10],['Zyrtec 10mg','Cetirizine','GSK','Tablet',6,9,6,400,20],['Glucophage 500','Metformin','Merck','Tablet',5,7.5,150,500,40],['Norvasc 5','Amlodipine','Pfizer','Tablet',8,12,80,420,25],['ORS Sachet','ORS','Nestle','Sachet',3,5,200,300,50],['Dettol 250ml','Chloroxylenol','Reckitt','Antiseptic',120,160,20,700,5],['Vitamin C 500','Ascorbic Acid','Getz','Tablet',4,6.5,0,300,30]];
 const meds=L.map((x,i)=>({id:'m'+i,name:x[0],gen:x[1],co:x[2],cat:x[3],batch:'B'+(101+i),exp:addD(x[7]),pp:x[4],sp:x[5],qty:x[6],re:x[8],loc:'R'+(i%4+1)}));
 const sales=[];for(let i=6;i>=0;i--){const it=[meds[i%8],meds[(i*3+2)%8]].map(m=>({mid:m.id,name:m.name,qty:2+i%3,sp:m.sp,pp:m.pp}));const sub=sum(it.map(x=>({v:x.qty*x.sp})),'v');sales.push({id:'s'+i,date:addD(-i),cust:'Walk-in',items:it,disc:0,total:sub,profit:sub-sum(it.map(x=>({v:x.qty*x.pp})),'v'),pay:'Cash',ret:false})}
 return{meds,sales,pur:[],adj:[],pay:[],sup:['Al-Shifa Distributors','MediLine Traders'],set:{name:'PharmaCare Pharmacy',cur:'Rs',lic:'LIC-0001'}}}
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D){D=seed();save()}
D.cus=D.cus||[{name:'Ali Khan',phone:'0300-1234567',addr:'Model Town'},{name:'Sara Ahmed',phone:'0321-7654321',addr:'Gulberg'}];D.exp=D.exp||[];D.cpay=D.cpay||[];D.pay=D.pay||[];D.adj=D.adj||[];
/* ---------- helpers ---------- */
function modal(h){$('#m').innerHTML='<div class="mb"><div class="mc">'+h+'</div></div>'}function closeM(){$('#m').innerHTML=''}
function cfm(msg,fn){window._f=fn;modal(`<p>${msg}</p><div class="r"><button class="b s" onclick="closeM()">Cancel</button><button class="b d" onclick="closeM();_f()">Confirm</button></div>`)}
const st=m=>{const d=dl(m.exp);return d<0?['Expired','r']:m.qty==0?['Out','r']:m.qty<=m.re?['Low','o']:d<=90?['Near expiry','o']:['OK','g']};
const tag=a=>`<span class="tag ${a[1]}">${a[0]}</span>`;
const bal=s=>sum(D.pur.filter(p=>p.sup==s&&!p.ret).map(p=>({v:p.total-p.paid})),'v')-sum(D.pay.filter(p=>p.sup==s),'amt');
const pages=[['dash','Dashboard'],['meds','Medicines'],['pur','Purchase'],['sales','Sales / POS'],['stock','Stock'],['rep','Reports'],['cus','Customers'],['sup','Suppliers'],['exp','Expenses'],['set','Settings']];
const IC={dash:'📊',meds:'💊',pur:'🛒',sales:'🧾',stock:'📦',rep:'📈',cus:'👥',sup:'🚚',exp:'💸',set:'⚙️'};let ROLE=null;
function login(){$('#nav').innerHTML='';$('#main').innerHTML='';modal(`<h3>💊 ${esc(D.set.name)} – Login</h3><div class="fg"><div><label>Role</label><select id="l_r"><option>Admin</option><option>Cashier</option></select></div><div><label>PIN (Admin 1234 · Cashier 0000)</label><input id="l_p" type="password" onkeydown="if(event.key=='Enter')doLogin()"></div></div><p style="color:var(--mu)">Cashier can use Sales and Customers only.</p><div class="r"><button class="b" onclick="doLogin()">Login</button></div>`)}
function doLogin(){const r=$('#l_r').value;if($('#l_p').value!=(r=='Admin'?'1234':'0000'))return toast('Wrong PIN',1);ROLE=r;V=r=='Admin'?'dash':'sales';closeM();render()}
function go(v){V=v;render()}
function render(){if(!ROLE)return login();if(ROLE!='Admin'&&!['sales','cus'].includes(V))V='sales';$('#nav').innerHTML='<h2>💊 '+esc(D.set.name.split(' ')[0])+'</h2><div style="color:#fff;font-size:12px;margin:-8px 8px 8px">👤 '+ROLE+'</div>'+pages.filter(p=>ROLE=='Admin'||['sales','cus'].includes(p[0])).map(p=>`<a class="${V==p[0]?'on':''}" onclick="go('${p[0]}')">${IC[p[0]]} ${p[1]}</a>`).join('')+'<a onclick="ROLE=null;render()">🔒 Logout</a>';$('#main').innerHTML=views[V]();if(V=='pur')drawP();if(V=='sales')drawC()}
document.onkeydown=e=>{if(e.key=='F2'){e.preventDefault();C={items:[]};go('sales')}if(e.key=='F9'&&V=='sales'){e.preventDefault();saveSale()}};
/* ---------- views ---------- */
const views={
dash(){const t=td(),ts=D.sales.filter(s=>s.date==t&&!s.ret),ms=D.meds,
 low=ms.filter(m=>m.qty<=m.re&&dl(m.exp)>=0).length,near=ms.filter(m=>{const d=dl(m.exp);return d>=0&&d<=90}).length,ex=ms.filter(m=>dl(m.exp)<0).length;
 const days=[...Array(7)].map((_,i)=>{const d=addD(i-6),ss=D.sales.filter(s=>s.date==d&&!s.ret);return{d,s:sum(ss,'total'),p:sum(ss,'profit')}}),mx=Math.max(1,...days.map(x=>x.s));
 const q={};D.sales.filter(s=>!s.ret).forEach(s=>s.items.forEach(i=>q[i.name]=(q[i.name]||0)+i.qty));const top=Object.entries(q).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=top.length?top[0][1]:1;
 return`<h3>Dashboard</h3><div class="r"><button class="b" onclick="go('sales')">+ New Sale</button><button class="b" onclick="go('pur')">+ New Purchase</button><button class="b" onclick="medForm('')">+ Add Medicine</button></div>
 <div class="g"><div class="cd"><span>Today's sales</span><b>${M(sum(ts,'total'))}</b></div><div class="cd"><span>Today's profit</span><b>${M(sum(ts,'profit'))}</b></div><div class="cd"><span>Stock value (cost)</span><b>${M(ms.reduce((a,m)=>a+m.qty*m.pp,0))}</b></div><div class="cd"><span>Low stock</span><b style="color:var(--or)">${low}</b></div><div class="cd"><span>Expiring ≤90 days</span><b style="color:var(--or)">${near}</b></div><div class="cd"><span>Expired</span><b style="color:var(--rd)">${ex}</b></div></div>
 <div class="cd"><h3>Sales vs Profit – last 7 days <small style="color:var(--mu)">(green = sales, orange = profit)</small></h3><div class="bars">${days.map(x=>`<div class="c" title="${x.d}: ${M(x.s)} / ${M(x.p)}"><i style="height:${x.s/mx*100}%;background:var(--pr)"></i><i style="height:${Math.max(0,x.p)/mx*100}%;background:var(--or)"></i></div>`).join('')}</div><div class="bars" style="height:auto;color:var(--mu);font-size:11px">${days.map(x=>`<div style="flex:1;text-align:center">${x.d.slice(5)}</div>`).join('')}</div></div>
 <div class="cd"><h3>Top 5 selling medicines</h3>${top.map(t=>`<div style="margin:6px 0">${esc(t[0])} <b>${t[1]}</b><div style="height:8px;border-radius:4px;background:var(--pr);width:${t[1]/tm*100}%"></div></div>`).join('')||'No sales yet'}</div>`},
meds(){return`<h3>Medicines</h3><div class="r"><input id="q" placeholder="Search name, generic, batch…" value="${esc(S.q)}" oninput="S.q=this.value;$('#tb').innerHTML=medRows()"><button class="b" onclick="medForm('')">+ Add Medicine</button></div><div class="cd w"><table><thead><tr><th>Name</th><th>Generic</th><th>Company</th><th>Batch</th><th>Expiry</th><th>Cost</th><th>Price</th><th>Margin</th><th>Qty</th><th>Loc</th><th></th></tr></thead><tbody id="tb">${medRows()}</tbody></table></div>`},
pur(){return`<h3>Purchase</h3><div class="cd"><div class="fg"><div><label>Supplier</label><select id="p_sup">${D.sup.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label>…or new supplier</label><input id="p_new"></div><div><label>Invoice #</label><input id="p_inv"></div><div><label>Date</label><input type="date" id="p_date" value="${td()}"></div></div>
 <div class="w"><table><thead><tr><th>Medicine / batch</th><th>Qty</th><th>Cost</th><th>Total</th><th></th></tr></thead><tbody id="prow"></tbody></table></div><button class="b s t" onclick="P.rows.push({mid:'',qty:1,pp:0});drawP()">+ Add row</button>
 <div class="r">Discount <input id="p_disc" type="number" min="0" value="0" style="width:90px" onchange="drawP()"> Paid now <input id="p_paid" type="number" min="0" value="0" style="width:110px"> <b id="ptot"></b> <button class="b" onclick="savePur()">Save purchase</button></div></div>
 <div class="cd w"><h3>Purchase history</h3><table><thead><tr><th>Date</th><th>Inv</th><th>Supplier</th><th>Total</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody>${D.pur.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.inv)}</td><td>${esc(p.sup)}</td><td>${M(p.total)}</td><td>${M(p.paid)}</td><td>${p.ret?tag(['Returned','r']):p.paid>=p.total?tag(['Paid','g']):p.paid>0?tag(['Partial','o']):tag(['Unpaid','r'])}</td><td>${p.ret?'':`<button class="b d t" onclick="cfm('Return this purchase to supplier? Stock will be reduced.',()=>retPur('${p.id}'))">Return</button>`}</td></tr>`).join('')||'<tr><td colspan=7>No purchases yet</td></tr>'}</tbody></table></div>`},
sales(){return`<h3>Sales / POS <small style="color:var(--mu)">Enter = add first match (FEFO) · F2 new bill · F9 save</small></h3><div class="cd"><input id="sq" placeholder="Search medicine…" style="width:100%" autofocus oninput="showRes()" onkeydown="if(event.key=='Enter'){const r=results();if(r[0])addCart(r[0].id)}"><div id="res" class="w"></div></div>
 <div class="cd w"><table><thead><tr><th>Item</th><th>Batch</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody id="cart"></tbody></table>
 <div class="r">Customer <input id="c_n" list="cl" placeholder="optional" style="width:140px"><datalist id="cl">${D.cus.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist> Discount % <input id="c_d" type="number" min="0" max="100" value="0" style="width:70px" onchange="drawC()"> <select id="c_p"><option>Cash</option><option>Card</option><option>Credit</option></select> <b id="stot"></b> <button class="b" onclick="saveSale()">Save & Print (F9)</button></div></div>`},
stock(){const f={all:()=>1,low:m=>st(m)[0]=='Low',near:m=>st(m)[0]=='Near expiry',exp:m=>st(m)[0]=='Expired',out:m=>m.qty==0},l=D.meds.filter(f[F]);
 return`<h3>Stock</h3><div class="g"><div class="cd"><span>Value at cost</span><b>${M(D.meds.reduce((a,m)=>a+m.qty*m.pp,0))}</b></div><div class="cd"><span>Value at sale price</span><b>${M(D.meds.reduce((a,m)=>a+m.qty*m.sp,0))}</b></div></div>
 <div class="r">Filter <select onchange="F=this.value;render()">${[['all','All'],['low','Low stock'],['near','Expiring soon'],['exp','Expired'],['out','Out of stock']].map(o=>`<option value="${o[0]}" ${F==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="cd w"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Reorder</th><th>Status</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>${m.exp} (${dl(m.exp)}d)</td><td>${m.qty}</td><td>${m.re}</td><td>${tag(st(m))}</td><td><button class="b s t" onclick="adjForm('${m.id}')">Adjust</button></td></tr>`).join('')}</tbody></table></div>
 <div class="cd w"><h3>Adjustment log</h3><table><tbody>${D.adj.slice(-8).reverse().map(a=>`<tr><td>${a.date}</td><td>${esc(a.name)}</td><td>-${a.qty}</td><td>${esc(a.why)}</td></tr>`).join('')||'<tr><td>No adjustments</td></tr>'}</tbody></table></div>`},
rep(){const ss=D.sales.filter(s=>s.date>=R.f&&s.date<=R.t&&!s.ret),ps=D.pur.filter(p=>p.date>=R.f&&p.date<=R.t&&!p.ret),it={};
 ss.forEach(s=>s.items.forEach(i=>{const o=it[i.name]||(it[i.name]={q:0,r:0,p:0});o.q+=i.qty;o.r+=i.qty*i.sp;o.p+=i.qty*(i.sp-i.pp)}));
 return`<h3>Reports</h3><div class="r">From <input type="date" value="${R.f}" onchange="R.f=this.value;render()"> To <input type="date" value="${R.t}" onchange="R.t=this.value;render()"><button class="b s t" onclick="R.f=td();R.t=td();render()">Today</button><button class="b s t" onclick="R.f=addD(-6);R.t=td();render()">7 days</button><button class="b s t" onclick="R.f=addD(-29);R.t=td();render()">30 days</button><button class="b" onclick="csv()">Export CSV</button><button class="b s" onclick="window.print()">Print</button></div>
 <div class="g"><div class="cd"><span>Sales</span><b>${M(sum(ss,'total'))}</b></div><div class="cd"><span>Purchases</span><b>${M(sum(ps,'total'))}</b></div><div class="cd"><span>Gross profit</span><b>${M(sum(ss,'profit'))}</b></div><div class="cd"><span>Expenses</span><b>${M(sum(D.exp.filter(e=>e.date>=R.f&&e.date<=R.t),'amt'))}</b></div><div class="cd"><span>Net profit</span><b>${M(sum(ss,'profit')-sum(D.exp.filter(e=>e.date>=R.f&&e.date<=R.t),'amt'))}</b></div></div>
 <div class="cd w"><h3>Item-wise profit</h3><table><thead><tr><th>Item</th><th>Qty</th><th>Revenue</th><th>Profit</th></tr></thead><tbody>${Object.entries(it).sort((a,b)=>b[1].p-a[1].p).map(([n,o])=>`<tr><td>${esc(n)}</td><td>${o.q}</td><td>${M(o.r)}</td><td>${M(o.p)}</td></tr>`).join('')||'<tr><td>No data</td></tr>'}</tbody></table></div>
 <div class="cd w"><h3>Sales history</h3><table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Profit</th><th></th></tr></thead><tbody>${D.sales.filter(s=>s.date>=R.f&&s.date<=R.t).slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${esc(s.cust)}</td><td>${s.items.length}</td><td>${M(s.total)}</td><td>${M(s.profit)}</td><td>${s.ret?tag(['Returned','r']):`<button class="b s t" onclick="receipt('${s.id}')">View</button> <button class="b d t" onclick="cfm('Return this sale? Stock will be restored.',()=>retSale('${s.id}'))">Return</button>`}</td></tr>`).join('')}</tbody></table></div>`},
cus(){return`<h3>Customers</h3><div class="r"><button class="b" onclick="cusForm()">+ Add Customer</button></div><div class="cd w"><table><thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Total bought</th><th>Credit due</th><th></th></tr></thead><tbody>${D.cus.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.addr)}</td><td>${M(sum(D.sales.filter(s=>s.cust==c.name&&!s.ret),'total'))}</td><td>${M(cbal(c.name))}</td><td><button class="b t" onclick="cpayForm(${i})">Receive payment</button> <button class="b d t" onclick="cfm('Delete customer?',()=>{D.cus.splice(${i},1);save();render()})">Del</button></td></tr>`).join('')||'<tr><td colspan=6>No customers</td></tr>'}</tbody></table></div>`},
exp(){const t=sum(D.exp,'amt'),gp=sum(D.sales.filter(s=>!s.ret),'profit');return`<h3>Expenses</h3><div class="g"><div class="cd"><span>Gross profit (all time)</span><b>${M(gp)}</b></div><div class="cd"><span>Total expenses</span><b>${M(t)}</b></div><div class="cd"><span>Net profit</span><b>${M(gp-t)}</b></div></div><div class="cd"><div class="r"><input type="date" id="e_d" value="${td()}"><select id="e_c">${['Rent','Salary','Electricity','Transport','Other'].map(x=>`<option>${x}</option>`).join('')}</select><input id="e_n" placeholder="Note"><input id="e_a" type="number" min="1" placeholder="Amount" style="width:110px"><button class="b" onclick="addExp()">+ Add expense</button></div></div><div class="cd w"><table><tbody>${D.exp.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${e.cat}</td><td>${esc(e.note)}</td><td>${M(e.amt)}</td><td><button class="b d t" onclick="D.exp=D.exp.filter(x=>x.id!='${e.id}');save();render()">✕</button></td></tr>`).join('')||'<tr><td>No expenses yet</td></tr>'}</tbody></table></div>`},
sup(){return`<h3>Suppliers</h3><div class="cd w"><table><thead><tr><th>Supplier</th><th>Total purchased</th><th>Balance due</th><th></th></tr></thead><tbody>${D.sup.map((s,i)=>`<tr><td>${esc(s)}</td><td>${M(sum(D.pur.filter(p=>p.sup==s&&!p.ret),'total'))}</td><td>${M(bal(s))}</td><td><button class="b t" onclick="payForm(${i})">Record payment</button></td></tr>`).join('')}</tbody></table></div>`},
set(){return`<h3>Settings</h3><div class="cd"><div class="fg"><div><label>Pharmacy name</label><input id="s_n" value="${esc(D.set.name)}"></div><div><label>Currency</label><input id="s_c" value="${esc(D.set.cur)}"></div><div><label>License #</label><input id="s_l" value="${esc(D.set.lic)}"></div></div><div class="r"><button class="b" onclick="D.set={name:$('#s_n').value,cur:$('#s_c').value,lic:$('#s_l').value};save();render();toast('Saved')">Save</button><button class="b s" onclick="const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'">Toggle dark / light</button></div></div>
 <div class="cd"><h3>Backup & restore</h3><div class="r"><button class="b" onclick="modal('<p>Copy and keep this JSON:</p><textarea style=&quot;width:100%;height:240px&quot; onfocus=&quot;this.select()&quot;>'+esc(JSON.stringify(D))+'</textarea><button class=&quot;b&quot; onclick=&quot;closeM()&quot;>Close</button>')">Export JSON</button><button class="b s" onclick="modal('<p>Paste backup JSON:</p><textarea id=&quot;imp&quot; style=&quot;width:100%;height:240px&quot;></textarea><div class=&quot;r&quot;><button class=&quot;b&quot; onclick=&quot;impJ()&quot;>Import</button><button class=&quot;b s&quot; onclick=&quot;closeM()&quot;>Cancel</button></div>')">Import JSON</button><button class="b d" onclick="cfm('Erase all data and reload demo data?',()=>{D=seed();save();render()})">Reset demo data</button></div></div>`}};
/* ---------- medicines ---------- */
function medRows(){const q=S.q.toLowerCase();return D.meds.filter(m=>(m.name+m.gen+m.batch).toLowerCase().includes(q)).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.gen)}</td><td>${esc(m.co)}</td><td>${esc(m.batch)}</td><td>${m.exp}</td><td>${M(m.pp)}</td><td>${M(m.sp)}</td><td>${m.pp?((m.sp-m.pp)/m.pp*100).toFixed(0):0}%</td><td>${m.qty}</td><td>${esc(m.loc)}</td><td><button class="b s t" onclick="medForm('${m.id}')">Edit</button> <button class="b d t" onclick="cfm('Delete ${esc(m.name)}?',()=>{D.meds=D.meds.filter(x=>x.id!='${m.id}');save();render()})">Del</button></td></tr>`).join('')||'<tr><td colspan=11>No medicines</td></tr>'}
function medForm(id){const m=D.meds.find(x=>x.id==id)||{name:'',gen:'',co:'',cat:'Tablet',batch:'',exp:addD(365),pp:0,sp:0,qty:0,re:10,loc:''};
 const f=[['name','Name'],['gen','Generic name'],['co','Company'],['batch','Batch #'],['exp','Expiry','date'],['pp','Purchase price','number'],['sp','Sale price (MRP)','number'],['qty','Quantity','number'],['re','Reorder level','number'],['loc','Rack / location']];
 modal(`<h3>${id?'Edit':'Add'} medicine</h3><div class="fg">${f.map(x=>`<div><label>${x[1]}</label><input id="f_${x[0]}" type="${x[2]||'text'}" value="${esc(m[x[0]])}"></div>`).join('')}<div><label>Category</label><select id="f_cat">${['Tablet','Capsule','Syrup','Injection','Inhaler','Sachet','Antiseptic','Other'].map(c=>`<option ${m.cat==c?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="r"><button class="b" onclick="saveMed('${id}')">Save</button><button class="b s" onclick="closeM()">Cancel</button></div>`)}
function saveMed(id){const g=k=>$('#f_'+k).value.trim(),o={name:g('name'),gen:g('gen'),co:g('co'),cat:g('cat'),batch:g('batch'),exp:g('exp'),pp:+g('pp'),sp:+g('sp'),qty:+g('qty'),re:+g('re'),loc:g('loc')};
 if(!o.name||!o.batch||!o.exp)return toast('Name, batch and expiry are required',1);
 if([o.pp,o.sp,o.qty,o.re].some(x=>isNaN(x)||x<0))return toast('Numbers cannot be negative',1);
 if(o.sp<o.pp)return toast('Sale price is below purchase price',1);
 if(D.meds.some(m=>m.id!=id&&m.name.toLowerCase()==o.name.toLowerCase()&&m.batch==o.batch))return toast('Duplicate batch for this medicine',1);
 if(id)Object.assign(D.meds.find(m=>m.id==id),o);else D.meds.push({id:uid(),...o});save();closeM();render();toast('Saved')}
/* ---------- purchase ---------- */
P={rows:[{mid:'',qty:1,pp:0}]};
function drawP(){$('#prow').innerHTML=P.rows.map((r,i)=>`<tr><td><select onchange="P.rows[${i}].mid=this.value;P.rows[${i}].pp=(D.meds.find(m=>m.id==this.value)||{pp:0}).pp;drawP()"><option value="">Select…</option>${D.meds.map(m=>`<option value="${m.id}" ${r.mid==m.id?'selected':''}>${esc(m.name)} — ${esc(m.batch)} (${m.qty})</option>`).join('')}</select></td><td><input type="number" min="1" value="${r.qty}" style="width:70px" onchange="P.rows[${i}].qty=+this.value;drawP()"></td><td><input type="number" min="0" step="0.01" value="${r.pp}" style="width:90px" onchange="P.rows[${i}].pp=+this.value;drawP()"></td><td>${M(r.qty*r.pp)}</td><td><button class="b d t" onclick="P.rows.splice(${i},1);if(!P.rows.length)P.rows.push({mid:'',qty:1,pp:0});drawP()">✕</button></td></tr>`).join('');
 $('#ptot').textContent='Grand total: '+M(Math.max(0,P.rows.reduce((a,r)=>a+r.qty*r.pp,0)-(+$('#p_disc').value||0)))}
function savePur(){const rows=P.rows.filter(r=>r.mid&&r.qty>0&&r.pp>=0),sup=$('#p_new').value.trim()||$('#p_sup').value;
 if(!rows.length)return toast('Add at least one medicine',1);if(!sup)return toast('Supplier required',1);
 const total=Math.max(0,rows.reduce((a,r)=>a+r.qty*r.pp,0)-(+$('#p_disc').value||0)),paid=Math.min(Math.max(0,+$('#p_paid').value||0),total);
 rows.forEach(r=>{const m=D.meds.find(x=>x.id==r.mid);m.qty+=r.qty;m.pp=r.pp});
 D.pur.push({id:uid(),date:$('#p_date').value,inv:$('#p_inv').value,sup,items:rows.map(r=>({mid:r.mid,qty:r.qty})),total,paid,ret:false});
 if(!D.sup.includes(sup))D.sup.push(sup);P={rows:[{mid:'',qty:1,pp:0}]};save();render();toast('Purchase saved, stock updated')}
function retPur(id){const p=D.pur.find(x=>x.id==id);for(const i of p.items){if(D.meds.find(m=>m.id==i.mid).qty<i.qty)return toast('Not enough stock to return',1)}
 p.items.forEach(i=>D.meds.find(m=>m.id==i.mid).qty-=i.qty);p.ret=true;save();render();toast('Purchase returned')}
/* ---------- sales ---------- */
const results=()=>{const q=($('#sq')||{value:''}).value.toLowerCase();return q?D.meds.filter(m=>m.qty>0&&dl(m.exp)>=0&&(m.name+m.gen+m.batch).toLowerCase().includes(q)).sort((a,b)=>a.exp<b.exp?-1:1).slice(0,6):[]};
function showRes(){$('#res').innerHTML=results().length?'<table>'+results().map(m=>`<tr style="cursor:pointer" onclick="addCart('${m.id}')"><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>exp ${m.exp}</td><td>stock ${m.qty}</td><td>${M(m.sp)}</td></tr>`).join('')+'</table>':''}
function addCart(id){const m=D.meds.find(x=>x.id==id),c=C.items.find(x=>x.mid==id);if(c){if(c.qty>=m.qty)return toast('Only '+m.qty+' in stock',1);c.qty++}else C.items.push({mid:id,name:m.name,batch:m.batch,qty:1,sp:m.sp,pp:m.pp});$('#sq').value='';showRes();drawC();$('#sq').focus()}
function setQty(i,v){const c=C.items[i],m=D.meds.find(x=>x.id==c.mid);v=Math.floor(+v);if(v>m.qty){toast('Only '+m.qty+' in stock',1);v=m.qty}if(v<1)C.items.splice(i,1);else c.qty=v;drawC()}
function drawC(){const d=Math.min(100,Math.max(0,+$('#c_d').value||0));$('#cart').innerHTML=C.items.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${esc(x.batch)}</td><td><input type="number" value="${x.qty}" style="width:70px" onchange="setQty(${i},this.value)"></td><td>${M(x.sp)}</td><td>${M(x.qty*x.sp)}</td><td><button class="b d t" onclick="setQty(${i},0)">✕</button></td></tr>`).join('')||'<tr><td colspan=6>Cart is empty</td></tr>';
 $('#stot').textContent='Total: '+M(sum(C.items.map(x=>({v:x.qty*x.sp})),'v')*(1-d/100))}
function saveSale(){if(!C.items.length)return toast('Cart is empty',1);const d=Math.min(100,Math.max(0,+$('#c_d').value||0));
 for(const x of C.items){const m=D.meds.find(y=>y.id==x.mid);if(m.qty<x.qty||dl(m.exp)<0)return toast(x.name+': insufficient or expired stock',1)}
 const sub=sum(C.items.map(x=>({v:x.qty*x.sp})),'v'),total=sub*(1-d/100),cost=sum(C.items.map(x=>({v:x.qty*x.pp})),'v');
 C.items.forEach(x=>D.meds.find(y=>y.id==x.mid).qty-=x.qty);
 const s={id:uid(),date:td(),cust:$('#c_n').value||'Walk-in',items:C.items.map(x=>({mid:x.mid,name:x.name,qty:x.qty,sp:x.sp,pp:x.pp})),disc:d,total,profit:total-cost,pay:$('#c_p').value,ret:false};
 D.sales.push(s);C={items:[]};save();receipt(s.id);render()}
function receipt(id){const s=D.sales.find(x=>x.id==id);modal(`<div id="rcpt"><center><b>${esc(D.set.name)}</b><br>Lic: ${esc(D.set.lic)}<br>${s.date} · #${s.id.slice(-5)}</center><hr><table style="width:100%">${s.items.map(i=>`<tr><td>${esc(i.name)}<br>${i.qty} x ${i.sp}</td><td align="right">${(i.qty*i.sp).toFixed(2)}</td></tr>`).join('')}</table><hr>Discount: ${s.disc}%<br><b>TOTAL: ${M(s.total)}</b><br>Paid by: ${s.pay}<br>Customer: ${esc(s.cust)}<center><br>Thank you!</center></div><div class="r"><button class="b" onclick="window.print()">Print</button><button class="b s" onclick="closeM()">Close</button></div>`)}
function retSale(id){const s=D.sales.find(x=>x.id==id);s.items.forEach(i=>{const m=D.meds.find(x=>x.id==i.mid);if(m)m.qty+=i.qty});s.ret=true;save();render();toast('Sale returned, stock restored')}
/* ---------- stock, suppliers, misc ---------- */
function adjForm(id){const m=D.meds.find(x=>x.id==id);modal(`<h3>Adjust: ${esc(m.name)} (${m.qty} in stock)</h3><div class="fg"><div><label>Quantity to remove</label><input id="a_q" type="number" min="1" value="1"></div><div><label>Reason</label><select id="a_w"><option>Damaged</option><option>Lost</option><option>Expired disposal</option><option>Correction</option></select></div></div><div class="r"><button class="b" onclick="doAdj('${id}')">Apply</button><button class="b s" onclick="closeM()">Cancel</button></div>`)}
function doAdj(id){const m=D.meds.find(x=>x.id==id),q=Math.floor(+$('#a_q').value);if(!(q>0)||q>m.qty)return toast('Invalid quantity',1);m.qty-=q;D.adj.push({date:td(),name:m.name,qty:q,why:$('#a_w').value});save();closeM();render()}
function payForm(i){modal(`<h3>Pay ${esc(D.sup[i])}</h3><p>Balance due: ${M(bal(D.sup[i]))}</p><input id="y_a" type="number" min="1" placeholder="Amount"><div class="r"><button class="b" onclick="const a=+$('#y_a').value;if(!(a>0))return toast('Enter amount',1);D.pay.push({sup:D.sup[${i}],amt:a,date:td()});save();closeM();render()">Record</button><button class="b s" onclick="closeM()">Cancel</button></div>`)}
function csv(){const rows=[['Date','Customer','Items','Total','Profit']].concat(D.sales.filter(s=>s.date>=R.f&&s.date<=R.t&&!s.ret).map(s=>[s.date,s.cust,s.items.map(i=>i.name+' x'+i.qty).join('; '),s.total.toFixed(2),s.profit.toFixed(2)]));
 modal('<p>Copy this CSV into Excel / Sheets:</p><textarea style="width:100%;height:240px" onfocus="this.select()">'+esc(rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))+'</textarea><button class="b" onclick="closeM()">Close</button>')}
const cbal=n=>sum(D.sales.filter(s=>s.cust==n&&s.pay=='Credit'&&!s.ret),'total')-sum(D.cpay.filter(p=>p.n==n),'amt');
function addExp(){const a=+$('#e_a').value;if(!(a>0))return toast('Enter a valid amount',1);D.exp.push({id:uid(),date:$('#e_d').value,cat:$('#e_c').value,note:$('#e_n').value,amt:a});save();render();toast('Expense added')}
function cusForm(){modal('<h3>Add customer</h3><div class="fg"><div><label>Name</label><input id="u_n"></div><div><label>Phone</label><input id="u_p"></div><div><label>Address</label><input id="u_a"></div></div><div class="r"><button class="b" onclick="saveCus()">Save</button><button class="b s" onclick="closeM()">Cancel</button></div>')}
function saveCus(){const n=$('#u_n').value.trim();if(!n)return toast('Name required',1);if(D.cus.some(c=>c.name.toLowerCase()==n.toLowerCase()))return toast('Customer already exists',1);D.cus.push({name:n,phone:$('#u_p').value,addr:$('#u_a').value});save();closeM();render();toast('Customer added')}
function cpayForm(i){const n=D.cus[i].name;modal(`<h3>Payment from ${esc(n)}</h3><p>Credit due: ${M(cbal(n))}</p><input id="y_c" type="number" min="1" placeholder="Amount"><div class="r"><button class="b" onclick="const a=+$('#y_c').value;if(!(a>0))return toast('Enter amount',1);D.cpay.push({n:D.cus[${i}].name,amt:a,date:td()});save();closeM();render()">Receive</button><button class="b s" onclick="closeM()">Cancel</button></div>`)}
function impJ(){try{const j=JSON.parse($('#imp').value);if(!j.meds||!j.sales)throw 0;D=j;D.cus=D.cus||[];D.exp=D.exp||[];D.cpay=D.cpay||[];D.pay=D.pay||[];D.adj=D.adj||[];save();closeM();render();toast('Imported')}catch(e){toast('Invalid backup JSON',1)}}
render();
</script></body></html>
